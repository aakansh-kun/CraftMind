services:
  - type: web
    name: craftmind-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini/gemini-flash-lite-latest
      - key: GROQ_MODEL
        value: groq/openai/gpt-oss-20b
      - key: LLM_API_KEYS
        value: key_1:gemini,key_2:groq
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: ENABLE_CACHE
        value: "true"
